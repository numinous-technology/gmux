[project]
name = "gmux"
version = "0.1.0"
description = "Python client for gmux, the GPU multiplexer"
requires-python = ">=3.9"
readme = "../../README.md"
license = { text = "Apache-2.0" }

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["gmux*"]
